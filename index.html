<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Versión de prueba privada: que los buscadores no la indexen (también la cabecera X-Robots-Tag en vercel.json) -->
    <meta name="robots" content="noindex, nofollow" />
    <title>AuraGrid</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Reset base (equivalente al "preflight" de Tailwind, que antes se cargaba por CDN solo para esto;
         la app usa estilos en línea, no clases de Tailwind) -->
    <style>
      *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { line-height: inherit; background-color: #f1f5f9; color: #0f172a; }
      h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
      b, strong { font-weight: bolder; }
      a { color: inherit; text-decoration: inherit; }
      table { text-indent: 0; border-color: inherit; border-collapse: collapse; }
      ol, ul, menu { list-style: none; }
      img, svg, video, canvas { display: block; }
      img, video { max-width: 100%; height: auto; }
      button, input, select, optgroup, textarea { font: inherit; letter-spacing: inherit; color: inherit; border-radius: 0; background-color: transparent; opacity: 1; }
      ::placeholder { opacity: 1; color: color-mix(in oklab, currentcolor 50%, transparent); }
      textarea { resize: vertical; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AuraGrid necesita JavaScript. Actívalo en tu navegador para usar la app.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
